function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
document.getElementById('eye').addEventListener('click',function(){
  var p=document.getElementById('p');
  p.type = p.type==='password' ? 'text' : 'password';
  p.focus();
});
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var go=document.getElementById('go'), er=document.getElementById('e');
  var pass=document.getElementById('p').value.trim().toLowerCase();
  if(!pass){er.textContent='Введи пароль';return;}
  go.disabled=true; go.textContent='Открываю...'; er.textContent='';
  unlock(pass,false).catch(function(){
      go.disabled=false; go.textContent='Открыть';
      er.textContent='Пароль не подошёл';
   });
});

// --- запоминание пароля на устройстве (телевизор, планшет: ввёл один раз) ---
var KEY='tycho_brief_pw';
function savePw(p){ try{ localStorage.setItem(KEY,p); }catch(e){} }
function readPw(){ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } }
function dropPw(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function unlock(pass, silent){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
   .then(function(k){return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},k,
      {name:'AES-GCM',length:256},false,['decrypt']);})
   .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(DATA));})
   .then(function(buf){
      savePw(pass);
      var html=new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
   });
}

// автовход, если пароль уже вводили на этом устройстве
(function(){
  var saved=readPw();
  if(!saved) { document.getElementById('p').focus(); return; }
  var go=document.getElementById('go');
  go.disabled=true; go.textContent='Открываю...';
  unlock(saved,true).catch(function(){
    dropPw();                    // пароль сменили - забыть и спросить заново
    go.disabled=false; go.textContent='Открыть';
    document.getElementById('p').focus();
  });
})();
</script>
