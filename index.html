<style>
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:18px;box-sizing:border-box;
    background:#0c1320;color:#e7eefb;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .box{width:min(420px,100%);background:#111b2c;border:1px solid #26375a;border-radius:14px;
    padding:30px 22px;box-shadow:0 20px 50px rgba(0,0,0,.45);text-align:center;box-sizing:border-box;
    position:relative}
  .verbadge{position:absolute;top:10px;right:14px;font-size:10.5px;color:#5f7ba8;letter-spacing:.02em}
  h1{font-size:22px;margin:0 0 6px;color:#e7eefb;font-weight:700}
  p.sub{margin:0 0 22px;font-size:12px;color:#8ba1c3;letter-spacing:1.6px;text-transform:uppercase}
  .pw{position:relative}
  input{width:100%;font:inherit;font-size:17px;text-align:center;letter-spacing:3px;padding:12px;
    border:1px solid #26375a;border-radius:9px;background:#0f1a2b;color:#e7eefb;margin-bottom:12px;
    box-sizing:border-box}
  .pw input{padding-right:46px}
  input:focus{outline:2px solid #4da3ff;outline-offset:1px}
  #eye{position:absolute;right:6px;top:4px;width:36px;height:38px;padding:0;background:none;border:0;
       color:#8ba1c3;font-size:17px;cursor:pointer;line-height:1}
  #eye:hover{color:#e7eefb;background:none}
  button{width:100%;font:inherit;font-size:16px;padding:12px;border:0;border-radius:9px;
    background:#4da3ff;color:#0c1320;font-weight:700;cursor:pointer}
  button:hover{background:#6fb5ff}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#ff8f8f;font-size:14px;min-height:20px;margin-top:12px}
  .hint{margin-top:18px;font-size:12.5px;color:#5f7ba8;line-height:1.5}
</style></head>

function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
document.getElementById('eye').addEventListener('click',function(){
  var p=document.getElementById('p');
  p.type = p.type==='password' ? 'text' : 'password';
  p.focus();
});
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var go=document.getElementById('go'), er=document.getElementById('e');
  var pass=document.getElementById('p').value.trim().toLowerCase();
  if(!pass){er.textContent='Введи пароль';return;}
  go.disabled=true; go.textContent='Открываю...'; er.textContent='';
  unlock(pass,false).catch(function(){
      go.disabled=false; go.textContent='Открыть';
      er.textContent='Пароль не подошёл';
   });
});

// --- запоминание пароля на устройстве (телевизор, планшет: ввёл один раз) ---
var KEY='tycho_brief_pw';
function savePw(p){ try{ localStorage.setItem(KEY,p); }catch(e){} }
function readPw(){ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } }
function dropPw(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function unlock(pass, silent){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
   .then(function(k){return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},k,
      {name:'AES-GCM',length:256},false,['decrypt']);})
   .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(DATA));})
   .then(function(buf){
      savePw(pass);
      var html=new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
   });
}

// автовход, если пароль уже вводили на этом устройстве
(function(){
  var saved=readPw();
  if(!saved) { document.getElementById('p').focus(); return; }
  var go=document.getElementById('go');
  go.disabled=true; go.textContent='Открываю...';
  unlock(saved,true).catch(function(){
    dropPw();                    // пароль сменили - забыть и спросить заново
    go.disabled=false; go.textContent='Открыть';
    document.getElementById('p').focus();
  });
})();
</script>
